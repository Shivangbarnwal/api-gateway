routes:
  - path: /users
    service: users

  - path: /products
    service: products

  - path: /orders
    service: orders

services:
  users:
    strategy: roundRobin

    cache:
      enabled: true
      ttl: 60


    instances:
      - host: localhost
        port: 8001

      - host: localhost
        port: 8002

  products:
    strategy: random

    cache:
      enabled: false
      ttl: 60

    instances:
      - host: localhost
        port: 8003
      - host: localhost
        port: 8004

  orders:
    strategy: leastConnections

    cache:
      enabled: true
      ttl: 30

    instances:
      - host: localhost
        port: 8005
      - host: localhost
        port: 8006
      